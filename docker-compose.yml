services:
  db:
    image: postgres:18
    container_name: hohenheim-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: hohenheim_bot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d hohenheim_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
